# electron-builder — PCT dev builds (M1e-6). No code signing in v1 (design §Packaging); the README
# documents the SmartScreen/Gatekeeper "unidentified developer" steps. Installers land in dist/
# (gitignored). buildResources is resources/ — deliberately NOT build/, which PCT uses as a scratch
# target for `npm run export`. Production node_modules are pulled in automatically by electron-builder;
# `files` only needs to allow the electron-vite output + package.json.
appId: com.jlgabriel.pct
productName: PCT
copyright: © 2026 Juan Luis Gabriel — GPL-3.0-or-later

directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/*.map"

# Bundled binary assets copied to <resourcesPath>/assets, read at export time by anchorAsset.ts: the
# plant anchor mesh (pct_anchor.tmb) + its texture (pct_anchor.ttx). Our own content, compiled to FS4's
# binary format; licence in THIRD_PARTY_NOTICES.md.
extraResources:
  - from: assets
    to: assets

asar: true
# No native modules → nothing to rebuild against Electron's ABI.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

portable:
  artifactName: ${name}-${version}-portable.${ext}

# macOS builds must be produced on a Mac (dmg/zip can't be created from Windows). Both arches so
# Apple-silicon (e.g. an M4) and Intel are covered.
#
# ⚠️ `identity: "-"` is load-bearing, and its absence is a bug we shipped from v1.0 to v2.0.1.
# electron-builder does NOT fall back to ad-hoc signing on its own — its own documentation says so:
# with no identity set it searches the keychain, and "if none is found, signing is skipped for all
# architectures — there is no automatic ad-hoc fallback". The release runner has no certificate, so
# every .dmg went out with no signature at all, while the Electron.framework inside stayed signed by
# somebody else. On Apple silicon a bundle whose seal does not verify is not reported as an
# unidentified developer — it is reported as **damaged**, and that dialog offers only Move to Trash.
# The README documented the symptom and the xattr workaround for two years without anybody noticing
# it was a build setting, not a fact of life.
#
# Ad-hoc signing buys no trust: still unnotarized, still allowed by hand once. What it buys is a
# coherent bundle, which is the difference between a door with a lock and a door nailed shut.
# hardenedRuntime must come off with it — it enforces library validation, which rejects a pre-signed
# framework from another Team ID, and it earns nothing without notarization.
#
# Verified on an Apple silicon Mac in the sibling project (XP Object Placer 1.0.1) before being
# copied here: "damaged" became "Apple could not verify…", and Open Anyway launched the app.
mac:
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${name}-${version}.${ext}
